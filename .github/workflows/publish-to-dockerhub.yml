# Nom du workflow
name: Publish to Docker Hub

# Déclencheur : ce workflow s'exécute à chaque push sur la branche 'main'
on:
  push:
    branches:
      - main

# Définition des jobs
jobs:
  build_and_push:
    runs-on: ubuntu-latest # Utilise la dernière version d'Ubuntu

    steps:
    # Étape 1: Récupérer le code source de votre dépôt
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Configurer Python 3.12 (bonne pratique pour les actions qui pourraient en avoir besoin)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Étape 3: Configurer QEMU pour la compatibilité multi-architecture (bonne pratique)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Étape 4: Configurer Docker Buildx pour des builds optimisés
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Étape 5: Se connecter à Docker Hub en utilisant les secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Étape 6: Construire et pousser l'image de l'API
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest
        cache-from: type=gha,scope=api-build-cache
        cache-to: type=gha,mode=max,scope=api-build-cache

    # Étape 7: Construire et pousser l'image du frontend
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-frontend:latest
        cache-from: type=gha,scope=frontend-build-cache
        cache-to: type=gha,mode=max,scope=frontend-build-cache

  deploy_to_hf:
    # Ce job ne s'exécute que si le job 'build_and_push' a réussi
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Pousser un fichier README.md pour configurer le Space Hugging Face
      # Cette action va créer un commit dans le dépôt du Space pour le mettre à jour.
      - name: Push README to Hugging Face Space
        uses: huggingface/hub-action@v1
        with:
          # L'identifiant de votre Space
          repo_id: "emmanuelohug/api-voiture-autonome"
          repo_type: "space"
          # Le jeton d'accès que vous avez ajouté aux secrets
          token: ${{ secrets.HF_TOKEN }}
          # Le message du commit qui apparaîtra dans l'historique du Space
          commit_message: "Update Space to use latest Docker image"
          # Le contenu du fichier README.md à créer dans le Space
          # Ce fichier configure le Space pour qu'il utilise votre image Docker depuis Docker Hub.
          files: |
            README.md: |
              ---
              title: API de Segmentation de Scène Routière
              sdk: docker
              app_port: 5000
              ---