# Nom du workflow
name: Publish to Docker Hub

# Déclencheur : ce workflow s'exécute à chaque push sur la branche 'main'
on:
  push:
    branches:
      - main

# Définition des jobs
jobs:
  build_and_push:
    runs-on: ubuntu-latest # Utilise la dernière version d'Ubuntu

    steps:
    # Étape 1: Récupérer le code source de votre dépôt
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Configurer Python 3.12 (bonne pratique pour les actions qui pourraient en avoir besoin)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Étape 3: Configurer QEMU pour la compatibilité multi-architecture (bonne pratique)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Étape 4: Configurer Docker Buildx pour des builds optimisés
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Étape 5: Se connecter à Docker Hub en utilisant les secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Étape 6: Construire et pousser l'image de l'API
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest
        cache-from: type=gha,scope=api-build-cache
        cache-to: type=gha,mode=max,scope=api-build-cache

    # Étape 7: Construire et pousser l'image du frontend
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-frontend:latest
        cache-from: type=gha,scope=frontend-build-cache
        cache-to: type=gha,mode=max,scope=frontend-build-cache

  deploy_to_hf:
    # Ce job ne s'exécute que si le job 'build_and_push' a réussi
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Créer un fichier README.md localement pour la configuration du Space
      - name: Create Space README
        run: |
          echo "---" > README.md
          echo "title: API de Segmentation de Scène Routière" >> README.md
          echo "sdk: docker" >> README.md
          echo "app_port: 5000" >> README.md
          echo "---" >> README.md

      # Étape 2: Uploader le README.md pour déclencher le redéploiement du Space
      - name: Push README to Hugging Face Hub
        uses: huggingface/hub-upload@v0.4
        with:
          repo_id: "emmanuelohug/api-voiture-autonome"
          repo_type: "space"
          token: ${{ secrets.HF_TOKEN }}
          commit_message: "Update Space to use latest Docker image"
          # Spécifie le fichier à uploader et son nom dans le dépôt distant
          path_on_disk: README.md
          path_in_repo: README.md