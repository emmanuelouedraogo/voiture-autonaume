# Nom du workflow
name: Publish to Docker Hub

# Déclencheur : ce workflow s'exécute à chaque push sur la branche 'main'
on:
  push:
    branches:
      - main

# Définition des jobs
jobs:
  build_and_push:
    runs-on: ubuntu-latest # Utilise la dernière version d'Ubuntu

    steps:
    # Étape 1: Récupérer le code source de votre dépôt
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Configurer QEMU pour la compatibilité multi-architecture (bonne pratique)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Étape 3: Installer les dépendances et valider la configuration
    - name: Install dependencies and validate
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r frontend/requirements.txt

    # Étape 4: Configurer QEMU pour la compatibilité multi-architecture (bonne pratique)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Étape 5: Configurer Docker Buildx pour des builds optimisés
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Étape 6: Se connecter à Docker Hub en utilisant les secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Étape 7: Construire et pousser l'image de l'API
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest

    # Étape 8: Construire et pousser l'image du frontend
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-frontend:latest