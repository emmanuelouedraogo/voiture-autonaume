# Nom du workflow
name: CI/CD - Test, Build, and Deploy

# Déclencheurs : s'exécute à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Définition des jobs
jobs:
  ##################################################
  # Job 1: Lancer les tests de validation
  ##################################################
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest

    steps:
    # Étape 1: Récupérer le code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Configurer l'environnement Python 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Étape 3: Installer les dépendances du projet (y compris test et dev)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,dev]"

    # Étape 4: Exécuter les tests avec pytest et générer le rapport de couverture
    - name: Run tests with pytest
      run: pytest --cov=emmanuel_segmentation_package --cov-report=xml

    # Étape 5: Uploader le rapport de couverture sur Codecov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  ##################################################
  # Job 2: Construire et publier les images Docker
  ##################################################
  build:
    name: Construire et Pousser les images Docker
    # Ce job ne se lancera que si le job 'test' réussit
    needs: test
    # Condition : ne s'exécute que pour les push sur la branche 'main'
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest
        cache-from: type=gha,scope=api-build-cache
        cache-to: type=gha,mode=max,scope=api-build-cache

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-frontend:latest
        cache-from: type=gha,scope=frontend-build-cache
        cache-to: type=gha,mode=max,scope=frontend-build-cache

  #############################################################
  # Job 3: Déployer l'API sur Hugging Face
  #############################################################
  deploy_api:
    name: Déployer l'API sur Hugging Face
    # Ce job ne se lancera que si le job 'build' réussit
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 1. Cloner le dépôt du Space Hugging Face
      run: |
        # Clone le dépôt du Space dans un dossier nommé 'hf-space'
        git clone https://huggingface.co/spaces/emmanuelohug/api-voiture-autonome hf-space

    - name: 2. Créer le fichier de configuration README.md
      run: |
        # Crée le fichier README.md qui configure le Space pour utiliser l'image Docker de Docker Hub
        # et le place dans le dossier du Space cloné.
        echo "title: API de Segmentation de Scène Routière" > hf-space/README.md
        echo "sdk: docker" >> hf-space/README.md
        echo "app_port: 8000" >> hf-space/README.md
        echo "app_file: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest" >> hf-space/README.md

    - name: 3. Pousser les changements vers le Hub Hugging Face
      env:
        # Le jeton d'accès est utilisé pour s'authentifier
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        cd hf-space
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Modifie l'URL du remote pour inclure le jeton d'authentification
        git remote set-url origin "https://user:${HF_TOKEN}@huggingface.co/spaces/emmanuelohug/api-voiture-autonome"
        git add README.md
        # Crée un commit et le pousse uniquement s'il y a des changements
        if ! git diff --staged --quiet; then
          git commit -m "Deploy: Mise à jour de la configuration Docker"
          git push
        else
          echo "Aucun changement de configuration à déployer."
        fi