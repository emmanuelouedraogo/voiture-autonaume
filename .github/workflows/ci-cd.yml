# Nom du workflow
name: CI/CD - Test, Build, and Deploy

# Déclencheurs : s'exécute à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Définition des jobs
jobs:
  ##################################################
  # Job 1: Lancer les tests de validation
  ##################################################
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest

    steps:
    # Étape 1: Récupérer le code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Configurer l'environnement Python 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Étape 3: Installer les dépendances du projet (y compris test et dev)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,dev]"

    # Étape 4: Exécuter les tests avec pytest et générer le rapport de couverture
    - name: Run tests with pytest
      run: pytest --cov=emmanuel_segmentation_package --cov-report=xml

    # Étape 5: Uploader le rapport de couverture sur Codecov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  ##################################################
  # Job 2: Construire et publier les images Docker
  ##################################################
  build:
    name: Construire et Pousser les images Docker
    # Ce job ne se lancera que si le job 'test' réussit
    needs: test
    # Condition : ne s'exécute que pour les push sur la branche 'main'
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest
        cache-from: type=gha,scope=api-build-cache
        cache-to: type=gha,mode=max,scope=api-build-cache

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-frontend:latest
        cache-from: type=gha,scope=frontend-build-cache
        cache-to: type=gha,mode=max,scope=frontend-build-cache

  #############################################################
  # Job 3: Déployer l'API et le Frontend sur Hugging Face
  #############################################################
  deploy:
    name: Déployer sur Hugging Face Spaces
    # Ce job ne se lancera que si le job 'build' réussit
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Déployer l'API sur Hugging Face
      uses: huggingface/hub-action@v0
      with:
        repo_id: "emmanuelohug/api-voiture-autonome"
        repo_type: space
        token: ${{ secrets.HF_TOKEN }}
        commit_message: "Deploy API: Update Docker image"
        # Cette action va simplement créer un commit vide pour forcer le redémarrage du Space
        # Le Space est déjà configuré pour utiliser l'image Docker Hub avec le tag 'latest'
        allow_empty_commit: true

    - name: Déployer le Frontend sur Hugging Face
      uses: huggingface/hub-action@v0
      with:
        repo_id: "emmanuelohug/frontend-voiture-autonome" # Assurez-vous que ce nom de Space est correct
        repo_type: space
        token: ${{ secrets.HF_TOKEN }}
        commit_message: "Deploy Frontend: Update Docker image"
        allow_empty_commit: true