# Nom du workflow
name: CI/CD - Test, Build, and Deploy

# Déclencheurs : s'exécute à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Définition des jobs
jobs:
  ##################################################
  # Job 1: Lancer les tests de validation
  ##################################################
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest

    steps:
    # Étape 1: Récupérer le code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Configurer l'environnement Python 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Étape 3: Installer les dépendances du projet (y compris test et dev)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,dev]"

    # Étape 4: Exécuter les tests avec pytest et générer le rapport de couverture
    - name: Run tests with pytest
      run: pytest --cov=emmanuel_segmentation_package --cov-report=xml

    # Étape 5: Uploader le rapport de couverture sur Codecov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  ##################################################
  # Job 2: Construire et publier les images Docker
  ##################################################
  build:
    name: Construire et Pousser les images Docker
    # Ce job ne se lancera que si le job 'test' réussit
    needs: test
    # Condition : ne s'exécute que pour les push sur la branche 'main'
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest
        cache-from: type=gha,scope=api-build-cache
        cache-to: type=gha,mode=max,scope=api-build-cache

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-frontend:latest
        cache-from: type=gha,scope=frontend-build-cache
        cache-to: type=gha,mode=max,scope=frontend-build-cache

  #############################################################
  # Job 3: Déployer l'API sur Hugging Face
  #############################################################
  deploy_api:
    name: Déployer l'API sur Hugging Face
    # Ce job ne se lancera que si le job 'build' réussit
    needs: build
    runs-on: ubuntu-latest
    env:
      # Définit le nom du dépôt cible pour plus de clarté
      HF_SPACE_REPO: emmanuelohug/api-voiture-autonome
      
    steps:
    - name: 1. Installer Git LFS
      run: |
        sudo apt-get update
        sudo apt-get install git-lfs

    - name: 2. Cloner le dépôt du Space Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Configure Git pour utiliser le jeton d'accès pour toutes les opérations HTTPS
        git config --global credential.helper "store --file ~/.git-credentials"
        echo "https://user:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
        
        # Clone le dépôt du Space
        git clone "https://huggingface.co/spaces/${HF_SPACE_REPO}"
        
    - name: 3. Mettre à jour la configuration et pousser les changements
      run: |
        # Se déplace dans le dossier du dépôt cloné
        cd $(basename ${HF_SPACE_REPO})
        
        # Crée le fichier de configuration
        echo "---" > README.md
        echo "title: API de Segmentation de Scène Routière" >> README.md
        echo "sdk: docker" >> README.md
        echo "app_port: 8000" >> README.md
        echo "app_file: ${{ secrets.DOCKERHUB_USERNAME }}/voiture-autonaume-api:latest" >> README.md
        echo "---" >> README.md
        
        # Configure l'identité Git pour le commit
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add README.md
        # Crée un commit et le pousse uniquement s'il y a des changements
        if ! git diff --staged --quiet; then
          git commit -m "Deploy: Mise à jour de la configuration Docker"
          git push
        else
          echo "Aucun changement de configuration à déployer."
        fi