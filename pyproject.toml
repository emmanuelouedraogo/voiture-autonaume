[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emmanuel_segmentation_package"
version = "0.1.0"
authors = [
  { name="Emmanuel OUEDRAOGO", email="votre@email.com" },
]
description = "Un package pour la segmentation sémantique d'images de conduite."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "tensorflow>=2.16",
    "numpy",
    "Pillow",
    "matplotlib",
    "python-dotenv",
    "pandas",
    "requests",
    "flask",
    "gunicorn" # Serveur WSGI pour Flask en production
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "IPython", # Pour l'affichage interactif dans les notebooks
]

[project.scripts]
segmentation-cli = "api.run_cli:main"

[project.urls]
"Homepage" = "https://github.com/emmanuelouedraogo/voiture-autonaume"
"Bug Tracker" = "https://github.com/emmanuelouedraogo/voiture-autonaume/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["emmanuel_segmentation_package*", "api*"]